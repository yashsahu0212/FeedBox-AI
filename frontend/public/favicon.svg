<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="feedbox-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box Icon -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#feedbox-grad)" />

  <!-- Inner Feed Box Tray / Envelope Shape -->
  <path d="M128 160 C128 142.327 142.327 128 160 128 L352 128 C369.673 128 384 142.327 384 160 L384 320 C384 337.673 369.673 352 352 352 L160 352 C142.327 352 128 337.673 128 320 Z" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  
  <!-- Inbox Front Drop Notch -->
  <path d="M128 224 L208 224 C220 224 230 234 236 244 L244 256 C250 266 262 266 268 256 L276 244 C282 234 292 224 304 224 L384 224" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Spark / Flash Icon floating center-right -->
  <path d="M336 120 L352 168 L400 184 L352 200 L336 248 L320 200 L272 184 L320 168 Z" fill="url(#spark-grad)" filter="url(#glow)"/>
  <path d="M160 300 L170 330 L200 340 L170 350 L160 380 L150 350 L120 340 L150 330 Z" fill="url(#spark-grad)" opacity="0.85"/>

  <!-- Live Pulse Dot -->
  <circle cx="396" cy="116" r="28" fill="#38BDF8" />
  <circle cx="396" cy="116" r="16" fill="#FFFFFF" />
</svg>